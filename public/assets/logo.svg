<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <!-- Background & Borders for Emblem -->
    <linearGradient id="embBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <linearGradient id="embBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.7" />
    </linearGradient>

    <!-- Pulse Gradient -->
    <linearGradient id="horizPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#00f2fe" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Text Pulse Gradient -->
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow -->
    <filter id="miniGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ================= EMBLEM ICON (Left, 90x90) ================= -->
  <g transform="translate(10, 10)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="90" height="90" rx="24" fill="url(#embBg)" stroke="url(#embBorder)" stroke-width="1.8" />

    <!-- Top & Bottom Telemetry Bars -->
    <rect x="15" y="27" width="60" height="5" rx="2.5" fill="#38bdf8" fill-opacity="0.25" />
    <circle cx="19" cy="29.5" r="1.8" fill="#38bdf8" />
    
    <rect x="15" y="58" width="60" height="5" rx="2.5" fill="#34d399" fill-opacity="0.25" />
    <circle cx="19" cy="60.5" r="1.8" fill="#34d399" />

    <!-- Vital Pulse Waveform -->
    <path d="M 12,45 H 28 L 34,35 L 40,58 L 48,24 L 55,67 L 61,41 L 65,48 L 68,45 H 78"
          fill="none"
          stroke="url(#horizPulseGrad)"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.35"
          filter="url(#miniGlow)" />

    <path d="M 12,45 H 28 L 34,35 L 40,58 L 48,24 L 55,67 L 61,41 L 65,48 L 68,45 H 78"
          fill="none"
          stroke="url(#horizPulseGrad)"
          stroke-width="2.6"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Peak Nodes -->
    <circle cx="48" cy="24" r="2.8" fill="#ffffff" />
    <circle cx="48" cy="24" r="1.4" fill="#00f2fe" />
    
    <circle cx="55" cy="67" r="2.2" fill="#ffffff" />
    <circle cx="55" cy="67" r="1.1" fill="#10b981" />
  </g>

  <!-- ================= TYPOGRAPHY (Right) ================= -->
  <g transform="translate(118, 0)">
    <!-- Primary Wordmark: "LogPulse" -->
    <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
      <tspan fill="#ffffff">Log</tspan><tspan fill="url(#wordmarkGrad)">Pulse</tspan>
    </text>

    <!-- Version Pill -->
    <g transform="translate(202, 38)">
      <rect x="0" y="0" width="48" height="18" rx="9" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />
      <circle cx="8" cy="9" r="2.5" fill="#34d399" />
      <text x="16" y="12.5" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="0.5">v1.0</text>
    </g>

    <!-- Subtitle Tracking Strip -->
    <text x="1" y="83" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-weight="600" font-size="9.5" letter-spacing="2.5" fill="#64748b">
      REAL-TIME OBSERVABILITY
    </text>
  </g>
</svg>