<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#03060a" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="90%" stop-color="#34d399" stop-opacity="0.75" />
    </linearGradient>

    <!-- Core Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Log Stack Gradients -->
    <linearGradient id="topStackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="bottomStackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15" />
    </linearGradient>

    <!-- Ambient Neon Blur -->
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#059669" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Light Halo -->
  <circle cx="256" cy="256" r="220" fill="url(#neonGlow)" />

  <!-- Squircle Base Frame -->
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Inner Inset Accent -->
  <rect x="38" y="38" width="436" height="436" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />

  <!-- Telemetry Grid Accents -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 6">
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="336" x2="416" y2="336" />
    <line x1="176" y1="96" x2="176" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="336" y1="96" x2="336" y2="416" />
  </g>

  <!-- TOP LOG BAR: Structured Telemetry Header -->
  <g opacity="0.85">
    <rect x="110" y="160" width="292" height="20" rx="10" fill="url(#topStackGrad)" />
    <circle cx="126" cy="170" r="5" fill="#38bdf8" />
    <circle cx="144" cy="170" r="3" fill="#38bdf8" opacity="0.6" />
    <rect x="162" y="167" width="44" height="6" rx="3" fill="#ffffff" opacity="0.25" />
    <rect x="216" y="167" width="80" height="6" rx="3" fill="#ffffff" opacity="0.18" />
    <rect x="306" y="167" width="30" height="6" rx="3" fill="#38bdf8" opacity="0.4" />
  </g>

  <!-- BOTTOM LOG BAR: Tail Stream Footer -->
  <g opacity="0.85">
    <rect x="110" y="332" width="292" height="20" rx="10" fill="url(#bottomStackGrad)" />
    <circle cx="126" cy="342" r="5" fill="#34d399" />
    <rect x="144" y="339" width="62" height="6" rx="3" fill="#ffffff" opacity="0.25" />
    <rect x="216" y="339" width="90" height="6" rx="3" fill="#ffffff" opacity="0.15" />
    <rect x="316" y="339" width="46" height="6" rx="3" fill="#34d399" opacity="0.35" />
  </g>

  <!-- MAIN VITAL PULSE WAVEFORM (Center Active Telemetry) -->
  <!-- Neon Glow Path -->
  <path d="M 92,256 H 176 L 202,210 L 232,320 L 268,136 L 302,364 L 328,238 L 348,272 L 366,256 H 420"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.32"
        filter="url(#glowFilter)" />

  <!-- Solid Foreground Pulse Path -->
  <path d="M 92,256 H 176 L 202,210 L 232,320 L 268,136 L 302,364 L 328,238 L 348,272 L 366,256 H 420"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Core White Beam Intensity Line -->
  <path d="M 176,256 L 202,210 L 232,320 L 268,136 L 302,364 L 328,238 L 348,272 L 366,256"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9" />

  <!-- Peak Beacons -->
  <g transform="translate(268, 136)">
    <circle r="15" fill="#38bdf8" opacity="0.3" filter="url(#glowFilter)" />
    <circle r="7.5" fill="#ffffff" />
    <circle r="4" fill="#00f2fe" />
  </g>

  <g transform="translate(302, 364)">
    <circle r="13" fill="#34d399" opacity="0.3" filter="url(#glowFilter)" />
    <circle r="6.5" fill="#ffffff" />
    <circle r="3.5" fill="#10b981" />
  </g>

  <!-- Origin / Terminus Nodes -->
  <circle cx="92" cy="256" r="5" fill="#38bdf8" />
  <circle cx="420" cy="256" r="5" fill="#34d399" />
</svg>